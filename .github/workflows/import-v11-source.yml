name: Import verified V11 mobile source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v11-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-v11-source
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'cassiehu451-creator/must-fa-v11-mobile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the target repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 1

      - name: Download and verify the exact user-approved HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request
          from pathlib import Path

          expected_size = 9192698
          expected_sha256 = 'c549e57338e8142e2521c6d317b7ed0f552d8de2655f20562b295b45f44c96e9'
          target = Path('index.html')
          if target.exists():
              existing = target.read_bytes()
              if len(existing) == expected_size and hashlib.sha256(existing).hexdigest() == expected_sha256:
                  print('The verified index.html is already present; no changes required.')
                  raise SystemExit(0)
              raise SystemExit('Refusing to overwrite a different existing index.html.')

          urls = [
              'https://6aa52461607b796276633daf--must-fa-v11-mobile-demo.netlify.app/',
              'https://must-fa-v11-mobile-demo.netlify.app/',
          ]
          verified = None
          for url in urls:
              for attempt in range(2):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'MUST-V11-source-import/1.0', 'Accept-Encoding': 'identity'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          if response.status != 200:
                              raise ValueError('The source did not return HTTP 200.')
                          data = response.read(expected_size + 1)
                      if len(data) != expected_size:
                          raise ValueError(f'Unexpected file size: {len(data)}.')
                      actual_sha256 = hashlib.sha256(data).hexdigest()
                      if actual_sha256 != expected_sha256:
                          raise ValueError('The downloaded file does not match the approved source SHA-256.')
                      text = data.decode('utf-8')
                      if '<!doctype html>' not in text.lower() or 'MUST_MOBILE' not in text:
                          raise ValueError('The source is not the expected mobile HTML document.')
                      verified = data
                      print(f'Verified {len(data)} bytes; SHA-256: {actual_sha256}')
                      break
                  except Exception as error:
                      print(f'Download attempt {attempt + 1} failed: {error}')
                      if attempt == 0:
                          time.sleep(2)
              if verified is not None:
                  break
          if verified is None:
              raise SystemExit('No verified source was available; nothing has been uploaded or overwritten.')
          temporary = Path('index.html.import-tmp')
          temporary.write_bytes(verified)
          os.replace(temporary, target)
          PY

      - name: Commit only the verified website source
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add complete V11 mobile HTML with embedded images'
          git push origin HEAD:main
